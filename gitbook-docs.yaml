          key: frasekill-es
          title: 🇪🇸 Español
          path: es
          default: true
          content:
            directory: ./es
            language: es

        - type: space
          key: frasekill-en
          title: 🇬🇧 English
          path: en
          content:
            directory: ./en
            language: en

        - type: space
          key: frasekill-pt
          title: 🇵🇹 Português
          path: pt
          content:
            directory: ./pt
            language: pt

        - type: space
          key: frasekill-fr
          title: 🇫🇷 Français
          path: fr
          content:
            directory: ./fr
            language: fr

        - type: space
          key: frasekill-de
          title: 🇩🇪 Deutsch
          path: de
          content:
            directory: ./de
            language: de

        - type: space
          key: frasekill-tr
          title: 🇹🇷 Türkçe
          path: tr
          content:
            directory: ./tr
            language: tr

        - type: space
          key: frasekill-it
          title: 🇮🇹 Italiano
          path: it
          content:
            directory: ./it
            language: it

        - type: space
          key: frasekill-pl
          title: 🇵🇱 Polski
          path: pl
          content:
            directory: ./pl
            language: pl
